<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brandon Rose — Portfolio Constellation</title>
<style>
  :root{
    --bg:#030308;
    --panel-bg: rgba(10,12,20,0.65);
    --panel-border: rgba(255,255,255,0.08);
    --text:#e8ecf5;
    --text-dim:#8892a8;
    --c-platform:#ff7a1a;
    --c-operations:#22d3ee;
    --c-financial:#facc15;
    --c-marketing:#ec4899;
    --c-personal:#a78bfa;
    --c-code:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;
    font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--text);}
  #scene-container{position:fixed;inset:0;}
  #scene-container canvas{display:block;cursor:grab;}
  #scene-container canvas.hovering{cursor:pointer;}

  #hud{position:fixed;top:0;left:0;right:0;padding:24px 28px;pointer-events:none;
    display:flex;flex-direction:column;gap:14px;z-index:10;}
  #hud .title-block{pointer-events:none;}
  #hud h1{margin:0;font-size:22px;font-weight:600;letter-spacing:0.5px;}
  #hud h1 span{color:var(--text-dim);font-weight:400;}
  #hud .hint{margin:2px 0 0;font-size:12px;color:var(--text-dim);}

  #filters{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto;}
  .pill{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;
    background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--text);
    cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:7px;transition:transform .15s ease, border-color .15s ease;}
  .pill:hover{transform:translateY(-1px);}
  .pill.active{border-color:rgba(255,255,255,0.35);}
  .pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  #detail-panel{position:fixed;top:0;right:0;height:100%;width:360px;max-width:88vw;
    background:var(--panel-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-left:1px solid var(--panel-border);z-index:20;
    transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);
    padding:28px 26px;display:flex;flex-direction:column;gap:14px;}
  #detail-panel.open{transform:translateX(0);}
  #detail-panel .close-btn{position:absolute;top:20px;right:20px;background:none;border:none;
    color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;padding:4px;}
  #detail-panel .close-btn:hover{color:var(--text);}
  #detail-panel .cat-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;
    text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-top:26px;}
  #detail-panel .cat-badge .dot{width:8px;height:8px;border-radius:50%;}
  #detail-panel h2{margin:6px 0 0;font-size:24px;font-weight:600;}
  #detail-panel .subtitle{margin:0;font-size:13px;color:var(--text-dim);}
  #detail-panel p.desc{margin:10px 0 0;font-size:14px;line-height:1.55;color:#c7cede;}
  #detail-panel a.launch{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;padding:12px 18px;border-radius:10px;background:#fff;color:#0a0a12;font-weight:600;
    font-size:14px;text-decoration:none;transition:transform .15s ease, opacity .15s ease;}
  #detail-panel a.launch:hover{transform:translateY(-1px);}
  #detail-panel .launch.disabled{background:rgba(255,255,255,0.08);color:var(--text-dim);
    pointer-events:none;font-weight:500;}

  #tooltip{position:fixed;pointer-events:none;z-index:15;padding:6px 10px;border-radius:8px;
    background:rgba(10,12,20,0.85);border:1px solid var(--panel-border);font-size:12px;
    color:var(--text);transform:translate(-50%,-140%);opacity:0;transition:opacity .12s ease;
    white-space:nowrap;}
  #tooltip.show{opacity:1;}

  @media (max-width:640px){
    #hud{padding:16px;}
    #hud h1{font-size:17px;}
    .pill{padding:5px 10px;font-size:11px;}
    #detail-panel{width:100%;max-width:100%;}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

  <div id="scene-container"></div>

  <div id="hud">
    <div class="title-block">
      <h1>Brandon Rose <span>— Portfolio Constellation</span></h1>
      <p class="hint">Drag to orbit · Scroll to zoom · Click a node to open a project</p>
    </div>
    <div id="filters"></div>
  </div>

  <div id="tooltip"></div>

  <div id="detail-panel">
    <button class="close-btn" id="closePanel" aria-label="Close">✕</button>
    <div class="cat-badge"><span class="dot"></span><span id="d-cat"></span></div>
    <h2 id="d-title"></h2>
    <p class="subtitle" id="d-subtitle"></p>
    <p class="desc" id="d-desc"></p>
    <a class="launch" id="d-launch" target="_blank" rel="noopener noreferrer">Launch App ↗</a>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------------------------------------------------------------
   DATA — every project pulled from brandonrosewebsites Google Site
--------------------------------------------------------------------- */
const CATEGORIES = {
  platform:   { label: 'Platform',   color: 0xff7a1a },
  operations: { label: 'Operations', color: 0x22d3ee },
  financial:  { label: 'Financial',  color: 0xfacc15 },
  marketing:  { label: 'Marketing',  color: 0xec4899 },
  personal:   { label: 'Personal',   color: 0xa78bfa },
  code:       { label: 'Code & Docs',color: 0x94a3b8 },
};

const PROJECTS = [
  { title:"PropertyMax.ai", subtitle:"CEO Command Center MVP", category:"platform", tier:1,
    desc:"Flagship AI-driven property management platform and executive command center prototype.",
    url:"http://propertymax.ai/" },
  { title:"Operations Hub", subtitle:"ApartmentCorp Operations Hub", category:"operations", tier:1,
    desc:"Central operations portal coordinating day-to-day property management workflows.",
    url:"https://operationshub-aptcorp.manus.space/" },
  { title:"Vacancy Report", subtitle:"Vacancy Report WebApp", category:"operations", tier:1,
    desc:"Real-time vacancy tracking and reporting web app across the portfolio.",
    url:"https://vacancyapp-42vudntx.manus.space/" },
  { title:"Investor Summary", subtitle:"Investor Summary Portal", category:"financial", tier:1,
    desc:"Investor-facing performance summary and reporting portal.",
    url:"https://investor-summary.manus.space/" },
  { title:"Monthly Inspections", subtitle:"Inspections Tracker & Checklist", category:"operations", tier:2,
    desc:"Tracker app for monthly property inspection checklists and compliance.",
    url:"https://monthlycheck-tukrskz5.manus.space/" },
  { title:"Inventory QR", subtitle:"QR Inventory App", category:"operations", tier:2,
    desc:"QR-code driven inventory tracking tool for on-site assets.",
    url:"https://brandonrose2.github.io/qr-inventory-app/" },
  { title:"Cost Segregation", subtitle:"Cost Segregation Study Portal", category:"financial", tier:2,
    desc:"Web portal supporting cost segregation studies for tax planning.",
    url:"https://brandonrose2.github.io/cost-segregation-project/" },
  { title:"Flyer Generator [Manus]", subtitle:"Property Flyer Generator", category:"marketing", tier:2,
    desc:"Standalone PropertyMax tool for creating, printing, and downloading referral flyers.",
    url:"https://property-flyer-generator.manus.space/" },
  { title:"Flyer Generator [Claude]", subtitle:"PropertyMax Flyer Studio", category:"marketing", tier:2,
    desc:"Claude-built variant of the property flyer generator tool.",
    url:"https://brandonrose2.github.io/propertymax-flyer-studio-claude/" },
  { title:"Loss to Lease", subtitle:"Gates of Manhattan Report", category:"financial", tier:2,
    desc:"Loss-to-lease reporting app portal for portfolio performance.",
    url:"https://loss-to-lease.manus.space/portfolio" },
  { title:"Rental Comps [Claude]", subtitle:"Rental Comps Portal", category:"operations", tier:2,
    desc:"Claude-built rental comparables research portal.",
    url:"https://brandonrose2.github.io/claude-rent-comps/" },
  { title:"Piano Mastery", subtitle:"Piano Composition Mastery", category:"personal", tier:2,
    desc:"Personal project teaching piano composition fundamentals.",
    url:"https://piano-composition-mastery.manus.space" },
  { title:"EDD Audit Checklist", subtitle:"EDD Prep Checklist Portal", category:"financial", tier:3,
    desc:"Checklist portal for EDD audit preparation.",
    url:"https://brandonrose2.github.io/edd-audit-checklist/" },
  { title:"Report Schedule Builder", subtitle:"Marc's Report Schedule Builder", category:"operations", tier:3,
    desc:"Custom reporting system schedule builder for regional teams.",
    url:"https://marcreport-ypkstjhu.manus.space/" },
  { title:"Regional Data Collector", subtitle:"Regional Manager Data Collector", category:"operations", tier:3,
    desc:"Internal data collection tool for regional managers.", url:null },
  { title:"Property Directory", subtitle:"Property Directory", category:"operations", tier:3,
    desc:"Internal directory of managed properties.", url:null },
  { title:"Batch File Editor", subtitle:"Batch File Editor", category:"operations", tier:3,
    desc:"Internal batch file editing utility.", url:null },
  { title:"New Hire Onboarding", subtitle:"New Hire Onboarding WebApp", category:"operations", tier:3,
    desc:"Onboarding workflow app for new hires.", url:null },
  { title:"Peptides", subtitle:"Peptides WebApp", category:"personal", tier:3,
    desc:"Personal side-project web app.", url:null },
  { title:"Company Contacts", subtitle:"Notion Workspace", category:"code", tier:3,
    desc:"Company contacts directory maintained in Notion.", url:null },
  { title:"Team Workspace", subtitle:"Notion Workspace", category:"code", tier:3,
    desc:"Shared internal team workspace in Notion.", url:null },
  { title:"GitHub Repos", subtitle:"Repositories", category:"code", tier:3,
    desc:"Source repositories backing these projects.", url:"https://github.com/repos" },
];

/* ---------------------------------------------------------------------
   SCENE — bare-minimum geometry, tight camera bounds, fog for depth cue
--------------------------------------------------------------------- */
const container = document.getElementById('scene-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030308);
scene.fog = new THREE.FogExp2(0x030308, 0.028);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 60
);
camera.position.set(0, 7, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.85;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.target.set(0, 1, 0);

// idle-based autorotate: pause while user is interacting, resume after 2.5s
let idleTimer = null;
function markInteracting(){
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => controls.autoRotate = true, 2500);
}
controls.addEventListener('start', markInteracting);

/* lighting kept minimal — nodes are emissive, this just lifts the floor/rings */
scene.add(new THREE.AmbientLight(0x404060, 1.2));
const key = new THREE.PointLight(0x8fb8ff, 2.2, 40);
key.position.set(6, 10, 8);
scene.add(key);

/* starfield — single BufferGeometry, one draw call */
(function buildStarfield(){
  const COUNT = 1600;
  const positions = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++){
    const r = 24 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    positions[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3 + 1] = r * Math.cos(phi);
    positions[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xaab4ff, size: 0.045, sizeAttenuation: true,
    transparent: true, opacity: 0.6 });
  scene.add(new THREE.Points(geo, mat));
})();

/* ground rings — cheap depth reference, no lit surfaces */
[6, 10, 14].forEach((r, i) => {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(r - 0.01, r, 96),
    new THREE.MeshBasicMaterial({ color: 0x141a2c, side: THREE.DoubleSide, transparent: true, opacity: 0.5 - i*0.1 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -3.4;
  scene.add(ring);
});

/* ---------------------------------------------------------------------
   NODES — "asymmetric-yield" layout: importance (tier) drives both
   size and camera proximity, not a uniform grid/sphere.
--------------------------------------------------------------------- */
const TIER_CONFIG = {
  1: { radius: 6,  size: 1.35, y: 1.4 },
  2: { radius: 10, size: 0.95, y: 0.6 },
  3: { radius: 14, size: 0.62, y: -0.3 },
};

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const nodes = [];       // { mesh, project, baseScale, baseEmissive }
const raycastTargets = [];
const tierCounts = { 1: 0, 2: 0, 3: 0 };

PROJECTS.forEach(p => {
  const cfg = TIER_CONFIG[p.tier];
  const idx = tierCounts[p.tier]++;
  const angle = idx * GOLDEN_ANGLE + p.tier; // offset per tier so rings don't align
  const jitterY = Math.sin(idx * 12.9898) * 0.5;

  const color = CATEGORIES[p.category].color;
  const geometry = new THREE.IcosahedronGeometry(cfg.size, 1);
  const material = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.28,
    metalness: 0.35, roughness: 0.45, flatShading: true,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(
    Math.cos(angle) * cfg.radius,
    cfg.y + jitterY,
    Math.sin(angle) * cfg.radius
  );
  mesh.userData.project = p;
  mesh.userData.baseY = mesh.position.y;
  mesh.userData.phase = idx;
  scene.add(mesh);
  raycastTargets.push(mesh);

  /* label sprite — canvas texture, billboards automatically */
  const label = makeLabelSprite(p.title, `#${color.toString(16).padStart(6,'0')}`);
  label.position.copy(mesh.position);
  label.position.y += cfg.size + 0.55;
  label.scale.multiplyScalar(cfg.tier === 1 ? 1 : 0.85);
  scene.add(label);

  nodes.push({ mesh, label, project: p, baseScale: cfg.size, baseEmissive: 0.28 });
});

function makeLabelSprite(text, colorHex){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const scale = 4;
  canvas.width = 512; canvas.height = 128;
  ctx.scale(1,1);
  ctx.font = `600 ${34*scale/scale}px Segoe UI, sans-serif`;
  ctx.font = '600 40px Segoe UI, -apple-system, sans-serif';
  const metrics = ctx.measureText(text);
  const paddingX = 28;
  const w = Math.min(canvas.width, metrics.width + paddingX*2);
  ctx.clearRect(0,0,canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(6,8,16,0.72)';
  roundRect(ctx, (canvas.width - w)/2, 34, w, 60, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  roundRect(ctx, (canvas.width - w)/2, 34, w, 60, 14);
  ctx.stroke();
  ctx.fillStyle = '#eef1fb';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width/2, 64);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.6, 0.65, 1);
  return sprite;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ---------------------------------------------------------------------
   POSTPROCESSING — bloom for the neon/emissive look
--------------------------------------------------------------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.35
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------------------------------------------------------------
   INTERACTION — raycast hover + click, category filter, detail panel
--------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
const panel = document.getElementById('detail-panel');
let hovered = null;
let activeCategory = 'all';
let selectedMesh = null;

function onPointerMove(e){
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(raycastTargets, false);
  const hit = hits[0]?.object ?? null;

  if (hit !== hovered){
    hovered = hit;
    renderer.domElement.classList.toggle('hovering', !!hovered);
    tooltip.classList.toggle('show', !!hovered);
  }
  if (hovered){
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.textContent = hovered.userData.project.subtitle;
  }
}

function onClick(){
  if (!hovered) return;
  selectedMesh = hovered;
  openPanel(hovered.userData.project);
}

renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', markInteracting);
renderer.domElement.addEventListener('click', onClick);

function openPanel(p){
  const cat = CATEGORIES[p.category];
  document.getElementById('d-cat').textContent = cat.label;
  document.querySelector('#detail-panel .cat-badge .dot').style.background = `#${cat.color.toString(16).padStart(6,'0')}`;
  document.getElementById('d-title').textContent = p.title;
  document.getElementById('d-subtitle').textContent = p.subtitle;
  document.getElementById('d-desc').textContent = p.desc;
  const launch = document.getElementById('d-launch');
  if (p.url){
    launch.href = p.url;
    launch.textContent = 'Launch App ↗';
    launch.classList.remove('disabled');
    launch.removeAttribute('aria-disabled');
  } else {
    launch.href = '#';
    launch.textContent = 'Internal tool — no public link';
    launch.classList.add('disabled');
    launch.setAttribute('aria-disabled', 'true');
  }
  panel.classList.add('open');
}
document.getElementById('closePanel').addEventListener('click', () => {
  panel.classList.remove('open');
  selectedMesh = null;
});

/* category filter pills */
const filtersEl = document.getElementById('filters');
function buildFilters(){
  const allPill = makePill('all', 'All Projects', null);
  filtersEl.appendChild(allPill);
  Object.entries(CATEGORIES).forEach(([key, cfg]) => {
    filtersEl.appendChild(makePill(key, cfg.label, cfg.color));
  });
}
function makePill(key, label, color){
  const el = document.createElement('div');
  el.className = 'pill' + (key === 'all' ? ' active' : '');
  el.dataset.key = key;
  el.innerHTML = color != null
    ? `<span class="dot" style="background:#${color.toString(16).padStart(6,'0')}"></span>${label}`
    : `<span class="dot" style="background:#fff"></span>${label}`;
  el.addEventListener('click', () => {
    activeCategory = key;
    [...filtersEl.children].forEach(c => c.classList.toggle('active', c === el));
  });
  return el;
}
buildFilters();

/* ---------------------------------------------------------------------
   RESIZE
--------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------
   ANIMATE
--------------------------------------------------------------------- */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  nodes.forEach(n => {
    const { mesh, label, project } = n;
    const isHover = mesh === hovered;
    const isSelected = mesh === selectedMesh;
    const matches = activeCategory === 'all' || project.category === activeCategory;

    // gentle bob + rotation per node, phase-offset so they don't sync
    mesh.position.y = mesh.userData.baseY + Math.sin(t * 0.6 + mesh.userData.phase) * 0.15;
    mesh.rotation.x += 0.0025;
    mesh.rotation.y += 0.0035;
    label.position.y = mesh.position.y + n.baseScale + 0.55;

    const targetScale = (n.baseScale) * (isHover || isSelected ? 1.25 : 1) * (matches ? 1 : 0.7);
    mesh.scale.lerp(new THREE.Vector3(1,1,1).multiplyScalar(targetScale / n.baseScale), 0.15);

    const targetEmissive = (isHover || isSelected ? 1.4 : n.baseEmissive) * (matches ? 1 : 0.25);
    mesh.material.emissiveIntensity += (targetEmissive - mesh.material.emissiveIntensity) * 0.15;

    const targetOpacity = matches ? 1 : 0.25;
    label.material.opacity += (targetOpacity - label.material.opacity) * 0.15;
    label.material.transparent = true;
  });

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
